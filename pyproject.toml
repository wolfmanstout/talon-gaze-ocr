[project]
name = "talon-gaze-ocr"
version = "0.1.0"
description = "Talon scripts to enable advanced cursor control using eye tracking and text recognition (OCR)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "click>=8.4.2",
    "line-profiler>=5.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=4.0.0",
]

[tool.ruff]
extend-exclude = [".subtrees/rapidfuzz"]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = [".tests"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
# Talon action class methods don't use self so ignore the associated errors and warnings
reportGeneralTypeIssues = false
reportSelfClsParameterName = false
# Talon can't be installed in CI so ignore source errors
reportMissingImports = false
extraPaths = [".subtrees/gaze-ocr", ".subtrees/screen-ocr", ".subtrees/rapidfuzz/src"]
# Override auto-exclude for owned subtrees, but keep rapidfuzz excluded
exclude = [".subtrees/rapidfuzz", ".uv-cache", ".venv", "**/__pycache__"]
